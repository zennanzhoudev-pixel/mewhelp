[project]
name = "mewhelp"
version = "0.5.0"
description = "MewHelp — 生产级电商 AI 智能客服系统(FastAPI + LangChain + LangGraph + Milvus + MySQL)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "langchain>=1.3,<2",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "asyncmy>=0.2.9",
    "pymilvus>=2.5,<3",
    "openai>=1.40,<2",
    "httpx>=0.27,<1",
    "langgraph>=0.2,<2",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
