<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>确认登录 · MewHelp</title>
  <style>
    :root{--blue:#3370ff;--ink:#202636;--muted:#7c8598;--line:#dfe3eb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:20px}
    .card{width:min(400px,100%);background:#fff;border:1px solid #e5e9f1;border-radius:22px;padding:27px;box-shadow:0 24px 70px rgba(32,48,80,.14)}
    .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#3370ff,#79a4ff);display:grid;place-items:center;color:#fff;font-weight:800;margin-bottom:19px}
    h1{font-size:22px;margin:0 0 7px}p{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 18px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;background:#f2f4f8;border-radius:10px;padding:4px;margin-bottom:17px}.tabs button{border:0;background:transparent;color:#70798a;border-radius:7px;padding:8px;font:12px inherit;cursor:pointer}.tabs button.on{background:#fff;color:#245bdb;font-weight:650;box-shadow:0 2px 7px rgba(30,50,90,.08)}
    .pane{display:none}.pane.on{display:block}
    input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;margin-bottom:10px;font-size:14px;outline:none}input:focus{border-color:#7aa2ff;box-shadow:0 0 0 3px rgba(51,112,255,.09)}
    .phone-row{position:relative}.phone-row input{padding-right:108px}.sms{border:0;background:#eef3ff;color:#3370ff;border-radius:7px;height:32px;padding:0 10px;position:absolute;right:6px;top:6px;font-size:11px;cursor:pointer}.sms:disabled{background:#f2f3f6;color:#a1a8b5}
    .main-btn{width:100%;height:44px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:650;font-size:14px;cursor:pointer}
    .err{color:#d54941;font-size:12px;min-height:18px;margin-top:9px}.okmsg{color:#218739;font-size:12px;min-height:18px;margin-top:9px}
    .ok{display:none;text-align:center;padding:10px 0}.ok.show{display:block}.ok .mark{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#e8f7ec;color:#218739;font-size:27px;margin:0 auto 14px}
  </style>
</head>
<body>
  <div class="card">
    <div id="loginView">
      <div class="logo">喵</div>
      <h1>确认登录 MewHelp</h1>
      <p>确认身份后，电脑端会自动进入。首次使用手机号登录会自动创建顾客账号。</p>
      <div class="tabs"><button type="button" class="on" data-tab="phone">手机号</button><button type="button" data-tab="password">账号密码</button></div>
      <div class="pane on" data-pane="phone">
        <input id="phone" inputmode="tel" maxlength="11" placeholder="手机号" autocomplete="tel">
        <div class="phone-row"><input id="code" inputmode="numeric" maxlength="6" placeholder="6 位验证码"><button class="sms" id="sendSms" type="button">获取验证码</button></div>
        <button class="main-btn" id="phoneApprove" type="button">登录并确认</button>
        <div class="okmsg" id="phoneOk"></div>
        <div class="err" id="phoneErr"></div>
      </div>
      <div class="pane" data-pane="password">
        <input id="username" placeholder="用户名 / 客服账号" autocomplete="username">
        <input id="password" type="password" placeholder="密码" autocomplete="current-password">
        <button class="main-btn" id="passwordApprove" type="button">登录并确认</button>
        <div class="err" id="passwordErr"></div>
      </div>
    </div>
    <div class="ok" id="ok"><div class="mark">✓</div><h1>登录已确认</h1><p>请回到电脑端，页面将自动进入。</p></div>
  </div>
  <script>
    const ticket = new URLSearchParams(location.search).get("ticket") || "";
    document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
      document.querySelectorAll("[data-tab]").forEach((x) => x.classList.toggle("on", x === b));
      document.querySelectorAll("[data-pane]").forEach((p) => p.classList.toggle("on", p.dataset.pane === b.dataset.tab));
    }));
    async function api(path, options) {
      const r = await fetch(path, options);
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.detail || "请求失败");
      return d;
    }
    async function approve(token) {
      if (!ticket) throw new Error("二维码参数缺失，请回电脑刷新二维码");
      await api("/api/auth/qr/" + encodeURIComponent(ticket) + "/approve", {
        method: "POST", headers: { Authorization: "Bearer " + token },
      });
      document.getElementById("loginView").style.display = "none";
      document.getElementById("ok").classList.add("show");
    }
    document.getElementById("sendSms").addEventListener("click", async () => {
      const btn = document.getElementById("sendSms"), ok = document.getElementById("phoneOk"), err = document.getElementById("phoneErr");
      ok.textContent = ""; err.textContent = "";
      try {
        const d = await api("/api/auth/sms/send", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: document.getElementById("phone").value.trim() }),
        });
        ok.textContent = d.debug_code ? "本地验证码：" + d.debug_code : "验证码已发送";
        if (d.debug_code) document.getElementById("code").value = d.debug_code;
        let n = 60; btn.disabled = true;
        const timer = setInterval(() => { btn.textContent = n + "s"; if (--n < 0) { clearInterval(timer); btn.disabled = false; btn.textContent = "获取验证码"; } }, 1000);
      } catch (e) { err.textContent = e.message; }
    });
    document.getElementById("phoneApprove").addEventListener("click", async () => {
      const err = document.getElementById("phoneErr"); err.textContent = "";
      try {
        const d = await api("/api/auth/sms/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: document.getElementById("phone").value.trim(), code: document.getElementById("code").value.trim() }),
        });
        await approve(d.token);
      } catch (e) { err.textContent = e.message; }
    });
    document.getElementById("passwordApprove").addEventListener("click", async () => {
      const err = document.getElementById("passwordErr"); err.textContent = "";
      try {
        const d = await api("/api/auth/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: document.getElementById("username").value.trim(), password: document.getElementById("password").value }),
        });
        await approve(d.token);
      } catch (e) { err.textContent = e.message; }
    });
  </script>
</body>
</html>
