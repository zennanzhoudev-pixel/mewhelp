<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>确认登录 · MewHelp</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#202636;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:20px}
    .card{width:min(390px,100%);background:#fff;border:1px solid #e5e9f1;border-radius:22px;padding:28px;box-shadow:0 24px 70px rgba(32,48,80,.14)}
    .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#3370ff,#79a4ff);display:grid;place-items:center;color:#fff;font-weight:800;margin-bottom:20px}
    h1{font-size:22px;margin:0 0 7px}p{color:#7c8598;font-size:13px;line-height:1.7;margin:0 0 20px}
    input{width:100%;height:44px;border:1px solid #dfe3eb;border-radius:10px;padding:0 12px;margin-bottom:11px;font-size:14px}
    button{width:100%;height:44px;border:0;border-radius:10px;background:#3370ff;color:#fff;font-weight:650;font-size:14px;cursor:pointer}
    .ok{display:none;text-align:center;padding:10px 0}.ok.show{display:block}.ok .mark{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#e8f7ec;color:#218739;font-size:27px;margin:0 auto 14px}
    .err{color:#d54941;font-size:12px;min-height:18px;margin-top:10px}
  </style>
</head>
<body>
  <div class="card">
    <div id="loginView">
      <div class="logo">喵</div>
      <h1>确认登录 MewHelp</h1>
      <p>你正在授权桌面端登录。请输入账号密码，确认后将自动返回桌面端。</p>
      <input id="username" placeholder="用户名 / 客服账号" autocomplete="username">
      <input id="password" type="password" placeholder="密码" autocomplete="current-password">
      <button id="confirm">确认登录</button>
      <div class="err" id="err"></div>
    </div>
    <div class="ok" id="ok"><div class="mark">✓</div><h1>登录已确认</h1><p>请回到电脑端，页面将自动进入。</p></div>
  </div>
  <script>
    const ticket = new URLSearchParams(location.search).get("ticket") || "";
    const err = document.getElementById("err");
    document.getElementById("confirm").addEventListener("click", async () => {
      err.textContent = "";
      if (!ticket) { err.textContent = "二维码参数缺失"; return; }
      try {
        const lr = await fetch("/api/auth/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        const data = await lr.json();
        if (!lr.ok) throw new Error(data.detail || "登录失败");
        const ar = await fetch("/api/auth/qr/" + encodeURIComponent(ticket) + "/approve", {
          method: "POST", headers: { Authorization: "Bearer " + data.token },
        });
        const ad = await ar.json();
        if (!ar.ok) throw new Error(ad.detail || "确认失败");
        document.getElementById("loginView").style.display = "none";
        document.getElementById("ok").classList.add("show");
      } catch (e) { err.textContent = e.message; }
    });
  </script>
</body>
</html>
