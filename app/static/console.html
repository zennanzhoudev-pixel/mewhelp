<!doctype html>
<html lang="zh-CN">
<head>
<script src="/static/auth.js"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>管理控制台 · MewHelp</title>
  <style>
    :root{--blue:#3370ff;--blue-soft:#eef3ff;--ink:#202636;--muted:#7d8698;--line:#e6e9f0;--bg:#f6f8fb}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
    .shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:10px;font-weight:750;padding:2px 10px 24px}.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3370ff,#75a1ff);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;box-shadow:0 7px 18px rgba(51,112,255,.2)}
    .nav a{display:flex;align-items:center;gap:11px;text-decoration:none;color:#596276;border-radius:10px;padding:11px 12px;font-size:13px;margin:2px 0}.nav a:hover{background:#f3f6fc;color:#245bdb}.nav a.on{background:var(--blue-soft);color:#245bdb;font-weight:650}.nav .ico{width:20px;text-align:center;font-size:15px}
    .side-foot{margin-top:auto;padding:14px 10px;border-top:1px solid #eff1f5;font-size:11px;color:#a0a7b5;line-height:1.7}
    .main{min-width:0}.top{height:68px;display:flex;align-items:center;gap:18px;background:rgba(246,248,251,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(230,233,240,.8);padding:0 190px 0 28px;position:sticky;top:0;z-index:5}
    .crumb{font-size:14px;font-weight:650}.search{height:36px;flex:1;max-width:560px;border:1px solid #e2e6ee;border-radius:10px;background:#fff;padding:0 13px;color:#8e96a6;font-size:12px;display:flex;align-items:center;gap:8px}
    .content{padding:28px;max-width:1520px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}.welcome h1{font-size:26px;margin:0 0 7px;letter-spacing:-.5px}.welcome p{margin:0;color:var(--muted);font-size:13px}.date{font-size:12px;color:#8f97a7}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.kpi{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;position:relative;overflow:hidden}.kpi:after{content:"";position:absolute;width:86px;height:86px;border-radius:50%;right:-30px;top:-30px;background:#f1f5ff}.kpi label{font-size:12px;color:var(--muted)}.kpi b{display:block;font-size:28px;margin:8px 0 3px;letter-spacing:-.8px}.kpi small{font-size:11px;color:#8992a3}
    .grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px}.panel h2{font-size:15px;margin:0 0 15px;display:flex;justify-content:space-between;align-items:center}.panel h2 a{font-size:11px;color:var(--blue);text-decoration:none;font-weight:500}
    .modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.module{border:1px solid #ebedf2;border-radius:12px;padding:13px;text-decoration:none;color:inherit;display:block;transition:.15s}.module:hover{border-color:#bcd0ff;box-shadow:0 8px 22px rgba(43,76,150,.08);transform:translateY(-1px)}.module-top{display:flex;align-items:center;justify-content:space-between}.module b{font-size:13px}.pill{font-size:10px;padding:3px 7px;border-radius:20px;background:#f0f3f7;color:#7f889a}.pill.ok{background:#e9f8ee;color:#238546}.pill.attention{background:#fff4df;color:#b56b00}.pill.error{background:#ffebeb;color:#d54941}.module p{font-size:11px;line-height:1.6;color:#7f8898;margin:8px 0 0;min-height:34px}
    .todo-list{display:grid;gap:9px}.todo{display:flex;align-items:center;gap:11px;padding:11px;border-radius:11px;background:#f8f9fc}.todo-icon{width:32px;height:32px;border-radius:9px;background:#e8f0ff;color:#3370ff;display:grid;place-items:center}.todo b{display:block;font-size:12px}.todo span{font-size:10px;color:#8b94a5}.todo strong{margin-left:auto;font-size:18px;color:#3370ff}
    .shortcuts{display:grid;gap:8px;margin-top:13px}.shortcuts a{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border:1px solid #eceef3;border-radius:10px;text-decoration:none;color:#424a5b;font-size:12px}.shortcuts a:hover{background:#f7f9ff}
    .loading{color:#98a0af;font-size:12px}.note{margin-top:16px;padding:11px 13px;border-radius:10px;background:#f1f6ff;color:#53647f;font-size:11px;line-height:1.7}
    @media(max-width:1000px){.shell{grid-template-columns:76px 1fr}.brand span:last-child,.nav span:last-child,.side-foot{display:none}.brand{padding-left:7px}.nav a{justify-content:center}.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{padding-right:80px}}
    @media(max-width:650px){.content{padding:18px 14px}.modules{grid-template-columns:1fr}.top{padding:0 70px 0 14px}.search{display:none}.kpis{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="brand-mark">M</span><span>MewHelp 管理台</span></div>
    <nav class="nav">
      <a class="on" href="/console"><span class="ico">▦</span><span>工作台</span></a>
      <a href="/admin/users"><span class="ico">♙</span><span>账号与权限</span></a>
      <a href="/kb"><span class="ico">▤</span><span>知识库</span></a>
      <a href="/review"><span class="ico">✓</span><span>内容审核</span></a>
      <a href="/observability"><span class="ico">⌁</span><span>数据与成本</span></a>
      <a href="/topics"><span class="ico">◎</span><span>主题分析</span></a>
      <a href="/acceptance"><span class="ico">◇</span><span>模型验收</span></a>
      <a href="/agent"><span class="ico">☏</span><span>人工客服</span></a>
    </nav>
    <div class="side-foot">企业级智能客服<br>MewHelp Console v0.2</div>
  </aside>
  <main class="main">
    <div class="top"><div class="crumb">企业管理 / 工作台</div><div class="search">⌕ 搜索功能导航、账号、知识内容…</div></div>
    <div class="content">
      <div class="welcome"><div><h1>早上好，<span id="helloName">管理员</span></h1><p>这里是团队今天的服务与系统状态。</p></div><div class="date" id="today"></div></div>
      <section class="kpis">
        <div class="kpi"><label>团队成员</label><b id="userCount">—</b><small>当前租户账号</small></div>
        <div class="kpi"><label>人工待接入</label><b id="waitingCount">—</b><small>未认领会话</small></div>
        <div class="kpi"><label>知识内容</label><b id="kbCount">—</b><small>可用知识块</small></div>
        <div class="kpi"><label>飞轮待审</label><b id="reviewCount">—</b><small>需要人工判断</small></div>
      </section>
      <div class="grid">
        <section class="panel"><h2>业务模块 <a href="/admin">查看完整旧版后台 →</a></h2><div class="modules" id="modules"><div class="loading">读取模块状态…</div></div><div class="note">这里复用现有知识库、检索评估、数据飞轮和模型验收能力；账号权限与人工客服是本次新增模块。</div></section>
        <div>
          <section class="panel"><h2>业务待办</h2><div class="todo-list" id="todos"><div class="loading">读取待办…</div></div><div class="shortcuts"><a href="/agent"><span>进入人工客服工作台</span><span>→</span></a><a href="/admin/users"><span>邀请客服或管理员</span><span>→</span></a><a href="/" target="_blank"><span>查看顾客端</span><span>↗</span></a></div></section>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  async function get(path) {
    const r = await fetch(path);
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
    return d;
  }
  async function load() {
    $("today").textContent = new Intl.DateTimeFormat("zh-CN", {year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date());
    const me = window.MewHelpAuth.getIdentity();
    if (me) $("helloName").textContent = me.display_name || me.username;
    const [ov, users, queue] = await Promise.all([
      get("/api/admin/overview"), get("/api/admin/users"), get("/api/support/workspace/queue")
    ]);
    $("userCount").textContent = users.items.length;
    $("waitingCount").textContent = queue.waiting;
    const by = Object.fromEntries(ov.modules.map((m) => [m.key, m]));
    $("kbCount").textContent = by.kb?.metrics?.find((m) => m.label === "知识块")?.value ?? "—";
    $("reviewCount").textContent = by.review?.metrics?.find((m) => m.label === "待审")?.value ?? "—";
    const labels = {ok:"正常", attention:"需处理", missing:"未配置", error:"异常"};
    $("modules").innerHTML = ov.modules.map((m) => `
      <a class="module" href="${m.page}">
        <div class="module-top"><b>${esc(m.title)}</b><span class="pill ${m.status}">${labels[m.status] || m.status}</span></div>
        <p>${esc(m.headline || "")}</p>
      </a>`).join("");
    $("todos").innerHTML = `
      <div class="todo"><span class="todo-icon">☏</span><div><b>人工会话待接入</b><span>顾客正在等待客服响应</span></div><strong>${queue.waiting}</strong></div>
      <div class="todo"><span class="todo-icon">♙</span><div><b>客服与管理员账号</b><span>可分配 customer / agent / admin 角色</span></div><strong>${users.items.length}</strong></div>
      <div class="todo"><span class="todo-icon">✓</span><div><b>飞轮知识待审</b><span>审核通过后立即写回知识库</span></div><strong>${by.review?.metrics?.find((m) => m.label === "待审")?.value ?? 0}</strong></div>`;
  }
  function esc(v) { return String(v ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
  window.addEventListener("mewhelp:auth-ready", load);
  if (window.MewHelpAuth.getIdentity()) load();
</script>
</body>
</html>
