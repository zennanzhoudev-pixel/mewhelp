name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Start services (MySQL + Milvus Standalone)
        run: docker compose up -d mysql etcd minio milvus-standalone

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 60); do
            docker compose exec -T mysql mysqladmin ping -proot --silent && exit 0
            sleep 3
          done
          exit 1

      - name: Wait for Milvus
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9091/healthz >/dev/null && exit 0
            sleep 3
          done
          exit 1

      - name: Run tests
        env:
          CHAT_MODEL: test-model
          CHAT_BASE_URL: http://localhost:9000/v1
          CHAT_API_KEY: test-chat-key
          EMBED_API_KEY: test-embed-key
          RERANK_API_KEY: test-rerank-key
          DATABASE_URL: mysql+asyncmy://root:root@127.0.0.1:3306/mewhelp
          TEST_DATABASE_URL: mysql+asyncmy://root:root@127.0.0.1:3306/mewhelp_test
          MILVUS_URI: http://127.0.0.1:19530
        run: uv run pytest -q -rs

