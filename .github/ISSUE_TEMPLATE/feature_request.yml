name: 功能建议
description: 新能力 / 改进建议
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前痛点是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望怎么改？有无备选方案？
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 对话 / Agent
        - 检索 / RAG
        - 工具 / MCP
        - 上下文
        - 飞轮 / 可观测
        - 分类器
        - 文档 / 工程
