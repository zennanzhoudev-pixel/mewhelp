# MewHelp 反向代理示例(SSE 必须关缓冲;TLS 证书换成你自己的)
server {
    listen 443 ssl;
    server_name mewhelp.example.com;

    ssl_certificate     /etc/letsencrypt/live/mewhelp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mewhelp.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 关键:关闭缓冲,否则 delta 不流式
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name mewhelp.example.com;
    return 301 https://$host$request_uri;
}

